[book]
title = "The Suji Programming Language"
authors = ["Suji Contributors"]
description = "A comprehensive guide to the Suji programming language"
language = "en"
src = "src"

[build]
# build-dir = "book"  # default
create-missing = false

# Preprocessors for enhanced functionality
# Note: Install with: cargo install mdbook-linkcheck mdbook-mermaid mdbook-katex
# Commented out until preprocessors are installed
# [preprocessor.linkcheck]
# [preprocessor.mermaid]
# [preprocessor.katex]

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/suji-lang/book"
edit-url-template = "https://github.com/suji-lang/book/edit/main/src/{path}"
# The book is published under https://suji-lang.org/book/, so every generated
# link needs that prefix.
site-url = "/book/"
smart-punctuation = true
# mdBook only copies its own three hardcoded highlight filenames out of theme/,
# so the palettes ride along as additional CSS instead. theme/index.hbs links
# all three of these by hand rather than through the additional_css loop,
# because the palettes need the ids that book.js toggles; add new entries in
# both places.
additional-css = ["theme/custom.css", "theme/suji-light.css", "theme/suji-dark.css"]
# The Suji-aware highlight.js bundle is not listed as additional-js on purpose:
# theme/book.js needs `hljs` at load time, and additional-js is injected after
# book.js. It is built to theme/highlight.js instead, which mdBook loads as a
# theme override and copies into the output itself.

[output.html.playground]
copyable = true
runnable = false

[output.html.search]
enable = true
limit-results = 30
boost-title = 2
boost-hierarchy = 1

[output.html.fold]
enable = true
level = 1

# Redirects for moved/renamed pages (add as needed)
[output.html.redirect]
# Example: "/old-page.html" = "new-location.html"
